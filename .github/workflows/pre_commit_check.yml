name: Pre-Commit Checks

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate hook configuration
        run: python -m pre_commit validate-config

      - name: Test formatting safeguards
        run: python -m unittest discover -s scripts/tests -v

      - name: Check formatting without modifying files
        run: bash scripts/auto_fix_all.sh --dry-run

      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Prepare empty test environment asset
        run: touch .env

      - name: Run Flutter tests
        run: flutter test --no-pub
