name: Campus App Code Formatting and Style Check

on:
  pull_request:
    branches: ['**']

permissions:
  contents: write
  pull-requests: write

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  format_and_check:
    runs-on: ubuntu-latest
    outputs:
      changes_made: ${{ steps.format.outputs.changes_made }}
      violations_found: ${{ steps.check.outputs.violations_found }}
    steps:
      - name: Setup workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Auto format code
        id: format
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          chmod +x ./scripts/auto_fix_all.sh
          ./scripts/auto_fix_all.sh

          if git diff --quiet && git diff --staged --quiet; then
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            git diff --name-only > /tmp/changed_files.txt
            git diff --stat > /tmp/diff_stats.txt
            git add -A

            if ! git diff --staged --quiet; then
              git commit -m "Auto-formatted and fixed code style issues [CI]" \
                         -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
              git push origin HEAD:${{ github.head_ref }}
              echo "changes_made=true" >> $GITHUB_OUTPUT
            else
              echo "changes_made=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check code style violations
        id: check
        run: |
          chmod +x ./scripts/auto_check_all.sh
          violations_file="/tmp/style_violations.txt"
          export VIOLATIONS_OUTPUT="$violations_file"

          if ./scripts/auto_check_all.sh; then
            echo "violations_found=false" >> $GITHUB_OUTPUT
          else
            echo "violations_found=true" >> $GITHUB_OUTPUT
            echo "violations_file=$violations_file" >> $GITHUB_OUTPUT

            if [[ ! -f "$violations_file" || ! -s "$violations_file" ]]; then
              echo "VIOLATIONS_DETAILS_START" > "$violations_file"
              echo "Code style violations detected but details unavailable" >> "$violations_file"
              echo "VIOLATIONS_DETAILS_END" >> "$violations_file"
            fi
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && (steps.format.outputs.changes_made == 'true' || steps.check.outputs.violations_found == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            function createFormatComment() {
              const changedFiles = fs.readFileSync('/tmp/changed_files.txt', 'utf8').trim().split('\n').filter(f => f);
              const diffStats = fs.readFileSync('/tmp/diff_stats.txt', 'utf8').trim();

              return `**Auto-formatting Applied**

            I've automatically applied code formatting and style fixes to this PR.

            ## Changes Made:
            - Dart formatting (100-character line length)
            - One-lined applicable if statements
            - One-line functions converted to arrow syntax
            - Fixed comment spacing
            - Added dates to TODO comments if missing
            - Trailing whitespace removal
            - Final newline enforcement

            ## Files Modified (${changedFiles.length} total):
            \`\`\`
            ${diffStats}
            \`\`\`

            The changes have been committed and are ready for review. No action needed on your part!

            *This comment was automatically generated by the auto-formatting workflow.*`;
            }

            try {
              let commentBody = '';

              if ('${{ steps.format.outputs.changes_made }}' === 'true') {
                commentBody = createFormatComment();
              } else if ('${{ steps.check.outputs.violations_found }}' === 'true') {
                // Create a simplified violations comment based on the detected violations
                commentBody = `## Code Style Violations Found

            **This PR contains coding style violations that must be manually addressed before merging.**

            Based on the automated check, violations were found in the following categories:
            - Static Constants (must be UPPER_SNAKE_CASE)
            - Variable Naming (must be lowerCamelCase)
            - Long If Statement Conditions (must be calculated beforehand to keep conditions readable)

            ## Style Guidelines

            - **Static Constants**: Use \`UPPER_SNAKE_CASE\` (e.g., \`MAX_RETRY_COUNT\`)
            - **Classes**: Use \`UpperCamelCase\` (e.g., \`UserProfile\`)
            - **Variables/Functions**: Use \`lowerCamelCase\` (e.g., \`userName\`)
            - **Files/Directories**: Use \`snake_case\` (e.g., \`user_profile.dart\`)
            - **Imports**: Use full package paths (e.g., \`package:app_name/path/file.dart\`)
            - **If Conditions**: Split long/complex conditions into variables for readability
            **Bad if condition:**
            \`\`\`dart
            if (userDataProvider.isLoggedIn &&
                (userDataProvider.userProfileModel.classifications?.staff ?? false)) {
              // action
            }
            \`\`\`
            **Good if condition:**
            \`\`\`dart
            var isLoggedIn = userDataProvider.isLoggedIn;
            var isStaff = userDataProvider.userProfileModel.classifications?.staff ?? false;
            if (isLoggedIn && isStaff) {
              // action
            }
            \`\`\`

            ## To fix these violations:

            1. Run \`./scripts/auto_check_all.sh\` locally to see where these violations are.
            2. Apply the suggested corrections.
            3. Re-run the script to verify fixes.
            4. Commit your changes.

            ---
            *This check will continue to fail until all violations are resolved.*`;
              }

              if (commentBody) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body: commentBody
                });
                console.log('PR comment added successfully');
              }
            } catch (error) {
              console.error('Error creating PR comment:', error.message);

              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `## Code Style Check Error

            There was an error processing the code style check results.

            **Error**: ${error.message}

            Please run the scripts locally to see the specific issues.`
                });
              } catch (fallbackError) {
                console.error('Failed to create fallback comment:', fallbackError.message);
              }
            }
